name: Rust libraries
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'examples/rust-embedding/**'
      - 'scripts/test_rust_library.py'
      - '.github/workflows/rust-libraries.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'examples/rust-embedding/**'
      - 'scripts/test_rust_library.py'
      - '.github/workflows/rust-libraries.yml'
permissions:
  contents: read
jobs:
  libraries:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        rust: ['1.90.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Rust
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.rust }}
      - name: Check existing Rust consumers and public documentation
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path examples/rust-embedding/Cargo.toml -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo test --locked --workspace --doc
          RUSTDOCFLAGS='-D warnings' cargo doc --locked -p invariant-workspace-core -p invariant-broker --no-deps
      - name: Verify packaged libraries from an independent consumer
        run: python3 -B scripts/test_rust_library.py --report .invariant/rust-library-checks/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-libraries-${{ matrix.os }}-${{ matrix.rust }}
          path: .invariant/rust-library-checks/
          include-hidden-files: true
          retention-days: 30
