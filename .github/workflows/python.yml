name: Python checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools and source package
        run: |
          python -m pip install --upgrade pip 'setuptools>=68' wheel
          python -m pip install -e .
      - name: Unit regressions
        run: |
          python -B -m unittest discover -s scripts/tests -q
          PYTHONPATH=sdk/python python -B -m unittest discover -s sdk/python/tests -q
      - name: Clean sdist, wheel and installed CLI
        run: python -B scripts/test_distribution.py --report .invariant/distribution/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: .invariant/distribution/
          include-hidden-files: true
          retention-days: 30
