[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invariant-workspace"
version = "0.3.0"
description = "Local parallel coding-agent experiments with isolated workspaces and reviewed changes"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
classifiers = ["Development Status :: 4 - Beta", "Environment :: Console", "Operating System :: MacOS", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.urls]
Repository = "https://github.com/Xenox-developer/invariant"
Documentation = "https://github.com/Xenox-developer/invariant#readme"
Issues = "https://github.com/Xenox-developer/invariant/issues"
Changelog = "https://github.com/Xenox-developer/invariant/blob/main/CHANGELOG.md"

[project.scripts]
invariant = "invariant.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["invariant*"]

[tool.setuptools.package-data]
invariant = ["assets/*", "_legacy/**/*"]

[tool.setuptools.cmdclass]
build_py = "_build.BuildPy"
