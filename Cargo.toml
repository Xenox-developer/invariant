[workspace]
members = ["crates/invariant-core", "crates/invariant-broker", "crates/invariant-supervisor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/Xenox-developer/invariant"

[workspace.dependencies]
anyhow = "1.0.104"
cap-std = "4.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
getrandom = "0.4.3"
httparse = "1.10.1"
sha2 = "0.10.9"
base64 = "0.22.1"
