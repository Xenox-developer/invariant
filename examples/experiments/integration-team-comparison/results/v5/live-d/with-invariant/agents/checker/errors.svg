<path d="M100 70 V420 H780" fill="none" stroke="black"/>
<text x="350" y="475">n (subintervals, linear scale)</text>
<text transform="translate(18 350) rotate(-90)">Absolute error (log10 scale)</text>
<text x="91.0" y="445">10</text>
<text x="188.14285714285714" y="445">20</text>
<text x="382.42857142857144" y="445">40</text>
