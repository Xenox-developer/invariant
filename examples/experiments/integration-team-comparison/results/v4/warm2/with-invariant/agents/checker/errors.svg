chor="middle">40</text><text x="565.0" y="444" font-family="sans-serif" font-size="14" text-anchor="middle">80</text><text x="310" y="475" font-family="sans-serif" font-size="14" text-anchor="middle">n (subintervals; log2 scale)</text><text x="20" y="230" font-family="sans-serif" font-size="14" transform="rotate(-90 20 230)" text-anchor="middle">abs_error (log10 scale)</text><polyline points="100.000,46.689 255.000,82.813 410.000,118.936 565.000,155.060" stroke="#1967b3" stroke-width="2" fill="none" /><circle cx="100.000" cy="46.689" r="4" fill="#1967b3" /><circle cx="255.000" cy="82.813" r="4" fill="#1967b3" /><circle cx="410.000" cy="118.936" r="4" fill="#1967b3" /><circle cx="565.000" cy="155.060" r="4" fill="#1967b3" /><line x1="600" y1="90" x2="625" y2="90" stroke="#1967b3" stroke-width="2" /><text x="635" y="95" font-family="sans-serif" font-size="14">trapezoid x^2</text><polyline points="100.000,28.653 255.000,64.757 410.000,100.876 565.000,136.998" stroke="#c53b25" stroke-width="2" fill="none" /><circle cx="100.000" cy="28.653" r="4" fill="#c53b25" /><circle cx="255.000" cy="64.757" r="4" fill="#c53b25" /><circle cx="410.000" cy="100.876" r="4" fill="#c53b25" /><circle cx="565.000" cy="136.998" r="4" fill="#c53b25" /><line x1="600" y1="122" x2="625" y2="122" stroke="#c53b25" stroke-width="2" /><text x="635" y="127" font-family="sans-serif" font-size="14">trapezoid x^4</text><polyline points="100.000,172.504 255.000,244.751 410.000,316.998 565.000,389.245" stroke="#16803c" stroke-width="2" fill="none" /><circle cx="100.000" cy="172.504" r="4" fill="#16803c" /><circle cx="255.000" cy="244.751" r="4" fill="#16803c" /><circle cx="410.000" cy="316.998" r="4" fill="#16803c" /><circle cx="565.000" cy="389.245" r="4" fill="#16803c" /><line x1="600" y1="154" x2="625" y2="154" stroke="#16803c" stroke-width="2" /><text x="635" y="159" font-family="sans-serif" font-size="14">simpson x^4</text></svg>
