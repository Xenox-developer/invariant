<path d="M95 70 V420 H665" fill="none" stroke="#222"/>
<text x="380" y="482" text-anchor="middle">Subintervals n (log2 scale)</text>
<text transform="translate(23 250) rotate(-90)" text-anchor="middle">Absolute error (log10 scale)</text>
<polyline points="95.000,108.908 285.000,139.011 475.000,169.114 665.000,199.217" fill="none" stroke="#1763a6" stroke-width="2.5"/>
