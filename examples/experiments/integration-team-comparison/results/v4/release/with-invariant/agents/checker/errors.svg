<svg xmlns="http://www.w3.org/2000/svg" width="840" height="510" viewBox="0 0 840 510" role="img" aria-labelledby="title desc"><title id="title">Absolute quadrature error on [0,1]</title><desc id="desc">Logarithmic error axis; Simpson x^2 is omitted because it is at roundoff.</desc><rect width="840" height="510" fill="white" /><text x="90" y="30" font-family="sans-serif" font-size="14">Integration error: x^2 and x^4 on [0,1]</text><line x1="90" y1="420.0" x2="550" y2="420.0" stroke="#dddddd" /><text x="20" y="425.0" font-family="sans-serif" font-size="14">1e-9</text><line x1="90" y1="365.0" x2="550" y2="365.0" stroke="#dddddd" /><text x="20" y="370.0" font-family="sans-serif" font-size="14">1e-8</text><line x1="90" y1="310.0" x2="550" y2="310.0" stroke="#dddddd" /><text x="20" y="315.0" font-family="sans-serif" font-size="14">1e-7</text><line x1="90" y1="255.0" x2="550" y2="255.0" stroke="#dddddd" /><text x="20" y="260.0" font-family="sans-serif" font-size="14">1e-6</text><line x1="90" y1="200.0" x2="550" y2="200.0" stroke="#dddddd" /><text x="20" y="205.0" font-family="sans-serif" font-size="14">1e-5</text><line x1="90" y1="145.0" x2="550" y2="145.0" stroke="#dddddd" /><text x="20" y="150.0" font-family="sans-serif" font-size="14">1e-4</text><line x1="90" y1="90.0" x2="550" y2="90.0" stroke="#dddddd" /><text x="20" y="95.0" font-family="sans-serif" font-size="14">1e-3</text><line x1="90" y1="35.0" x2="550" y2="35.0" stroke="#dddddd" /><text x="20" y="40.0" font-family="sans-serif" font-size="14">1e-2</text><line x1="90" y1="35" x2="90" y2="420" stroke="black" /><line x1="90" y1="420" x2="550" y2="420" stroke="black" /><line x1="90.0" y1="420" x2="90.0" y2="426" stroke="black" /><text x="90.0" y="445" font-family="sans-serif" font-size="14" text-anchor="middle">10</text><line x1="152.85714285714286" y1="420" x2="152.85714285714286" y2="426" stroke="black" /><text x="152.85714285714286" y="445" font-family="sans-serif" font-size="14" text-anchor="middle">20</text><line x1="278.57142857142856" y1="420" x2="278.57142857142856" y2="426" stroke="black" /><text x="278.57142857142856" y="445" font-family="sans-serif" font-size="14" text-anchor="middle">40</text><line x1="530.0" y1="420" x2="530.0" y2="426" stroke="black" /><text x="530.0" y="445" font-family="sans-serif" font-size="14" text-anchor="middle">80</text><text x="280" y="480" font-family="sans-serif" font-size="14">n (subintervals)</text><text x="16" y="20" font-family="sans-serif" font-size="14">abs_error (log10)</text><polyline points="90.000,77.798 152.857,110.912 278.571,144.025 530.000,177.138" fill="none" stroke="#1769aa" stroke-width="2" /><circle cx="90.000" cy="77.798" r="4" fill="#1769aa" /><circle cx="152.857" cy="110.912" r="4" fill="#1769aa" /><circle cx="278.571" cy="144.025" r="4" fill="#1769aa" /><circle cx="530.000" cy="177.138" r="4" fill="#1769aa" /><line x1="585" y1="95" x2="615" y2="95" stroke="#1769aa" /><text x="625" y="100" font-family="sans-serif" font-size="14">trapezoid x^2</text><polyline points="90.000,61.266 152.857,94.361 278.571,127.470 530.000,160.582" fill="none" stroke="#c05200" stroke-width="2" /><circle cx="90.000" cy="61.266" r="4" fill="#c05200" /><circle cx="152.857" cy="94.361" r="4" fill="#c05200" /><circle cx="278.571" cy="127.470" r="4" fill="#c05200" /><circle cx="530.000" cy="160.582" r="4" fill="#c05200" /><line x1="585" y1="130" x2="615" y2="130" stroke="#c05200" /><text x="625" y="135" font-family="sans-serif" font-size="14">trapezoid x^4</text><polyline points="90.000,193.128 152.857,259.355 278.571,325.582 530.000,391.808" fill="none" stroke="#188038" stroke-width="2" /><circle cx="90.000" cy="193.128" r="4" fill="#188038" /><circle cx="152.857" cy="259.355" r="4" fill="#188038" /><circle cx="278.571" cy="325.582" r="4" fill="#188038" /><circle cx="530.000" cy="391.808" r="4" fill="#188038" /><line x1="585" y1="165" x2="615" y2="165" stroke="#188038" /><text x="625" y="170" font-family="sans-serif" font-size="14">simpson x